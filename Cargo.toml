[workspace]
default-members = ["crates/ruf4"]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["ruf4 contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/kromych/ruf4"
homepage = "https://github.com/kromych/ruf4"
rust-version = "1.96"

[profile.release]
codegen-units = 1
debug = "full"
lto = true
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"
strip = "symbols"
incremental = true

[workspace.dependencies]
lsh = { package = "ruf4-lsh", path = "./crates/lsh", version = "0.1.0" }
ruf4-tui = { path = "./crates/tui", version = "0.1.0" }
stdext = { package = "ruf4-stdext", path = "./crates/stdext", version = "0.1.0" }
libc = "0.2"
