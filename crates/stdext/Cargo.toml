[package]
name = "ruf4-stdext"
description = "Arena allocators, collections, SIMD and Unicode helpers used by ruf4, derived from Microsoft Edit"
keywords = ["arena", "allocator", "simd", "unicode", "no-std"]
categories = ["memory-management", "data-structures", "text-processing"]
readme = "ReadMe.md"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "stdext"

[features]
single-threaded = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
