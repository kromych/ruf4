[package]
name = "ruf4"
description = "A dual-panel file commander for the terminal, inspired by FAR Manager"
keywords = ["file-manager", "commander", "tui", "terminal", "sftp"]
categories = ["command-line-utilities", "filesystem"]
readme = "../../ReadMe.md"

version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lsh = { workspace = true, features = ["glob"] }
ruf4-tui.workspace = true
stdext.workspace = true

[build-dependencies]
embed-resource = "3"
lsh = { workspace = true, features = ["compiler"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
